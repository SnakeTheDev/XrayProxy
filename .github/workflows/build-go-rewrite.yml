name: Build

on:
  push:
    branches: [go-rewrite, main]
  pull_request:
    branches: [go-rewrite, main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: -H windowsgui = no console (tray-only). Logs → app.log next to the exe.
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: HomeReality-windows-amd64.exe
            ldflags: "-s -w -H windowsgui"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: HomeReality-darwin-arm64
            ldflags: "-s -w"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: HomeReality-darwin-amd64
            ldflags: "-s -w"
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: HomeReality-linux-amd64
            ldflags: "-s -w"

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: homereality-go

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: homereality-go/go.sum

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev

      - name: Download modules
        run: go mod tidy

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          mkdir -p ../dist/pkg
          go build -ldflags "${{ matrix.ldflags }}" -o ../dist/pkg/${{ matrix.artifact }} ./cmd/homereality
          cp sing-box-config.json ../dist/pkg/

      # upload-artifact already compresses — do not zip again
      - uses: actions/upload-artifact@v4
        with:
          name: HomeReality-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/pkg/

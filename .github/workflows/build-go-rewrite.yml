name: Build

on:
  push:
    branches: [go-rewrite, main]
  pull_request:
    branches: [go-rewrite, main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: HomeReality-windows-amd64.exe
            gui_flags: "-H windowsgui"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: HomeReality-darwin-arm64
            gui_flags: ""
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: HomeReality-darwin-amd64
            gui_flags: ""
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: HomeReality-linux-amd64
            gui_flags: ""

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: homereality-go
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: homereality-go/go.sum

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev

      - name: Download modules
        run: go mod tidy

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          mkdir -p ../dist/pkg
          VER="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME}"
          fi
          LDFLAGS="-s -w ${{ matrix.gui_flags }} -X github.com/SnakeTheDev/XrayProxy/homereality-go/internal/ui.AppVersion=${VER}"
          go build -ldflags "$LDFLAGS" -o ../dist/pkg/${{ matrix.artifact }} ./cmd/homereality
          cp sing-box-config.json ../dist/pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: HomeReality-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/pkg/
